services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
      POSTGRES_DB: vigil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      VIGIL_DATABASE_URL: postgresql+psycopg://vigil:${POSTGRES_PASSWORD:-vigil}@db:5432/vigil
      VIGIL_JWT_SECRET: ${VIGIL_JWT_SECRET:?set VIGIL_JWT_SECRET in .env}
      VIGIL_INGEST_TOKEN: ${VIGIL_INGEST_TOKEN:-}
      VIGIL_ALLOW_REGISTRATION: ${VIGIL_ALLOW_REGISTRATION:-true}
      VIGIL_DEMO_BACKFILL_HOURS: ${VIGIL_DEMO_BACKFILL_HOURS:-24}
      VIGIL_NOISE_EPS: ${VIGIL_NOISE_EPS:-0}
      VIGIL_CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${VIGIL_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
